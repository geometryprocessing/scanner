    save_undistorted: False 

  mask: # what to do here? maybe a trained object detection/classification?

  pose_registration: # we rely on charuco boards for pose registration
    charuco_board:
      rows: 17
      columns: 28
      marker_size: 15 # in mm
      checker_size: 20 # in mm
      dictionary: 5X5_1000
      valid_ids: # this is peculiar to the set-up, since the board is cut and we need to specify which markers to consider

# which SfM pipeline to run - you can pick both
run_metashape: True
run_colmap: False

# configuration for SfM pipeline using Agisoft Metashape
# NOTE: the software needs to be installed, a license key is required, and 
# the wheels need to be built for Python API (https://www.agisoft.com/downloads/installer/)
metashape:
  # what to load
  load:
    camera_intrinsics: True
    camera_extrinsics: True
    markers: False
    depth_maps: False
    point_cloud: False
    mesh: False

  # what to save/export
  save:
    # if set to False, None, or just missing, then it will not be saved
    report: metashape_report.pdf
    point_cloud: metashape_point_cloud.ply
    mesh: metashape_mesh.obj
    depth_maps: True

  # what to run
  run:
    load_images: True
    match_photos: True
    align_cameras: True
    build_depth_maps: True
    build_point_cloud: True
    build_mesh: True

  # parameters for the functions
  match_photos:    
    downscale: 1 # [1,2,4,8,16] 1 means no downscaling, 16 means the most downscaling (less accurate but faster)

    # only play with these if you know what you are doing
    generic_preselection: True
    reference_preselection: False
    keypoint_limit: 40000
    tiepoint_limit: 4000
    reuse_matches: False
    subdivide_task: True
    workitem_size_cameras: 20
    max_workgroup_size: 100

  align_cameras:
    reset_alignment: True # throw away existing alignment and start from scratch
    min_image: 2 # minimum number of points

    fisheye: False # only true if your lenses are fisheye (i.e. very wide field of view)

    # only play with these if you know what you are doing
    adaptive_fitting: False
    reset_alignment: False
    subdivide_task: True

  build_depth_maps:

  build_point_cloud:
    replace_asset: True
    source_data: Metashape.DepthMapsData
    point_confidence: True
    point_colors: True
    keep_depth: True
    max_neighbors: 10 # ? what does this do? how does it change the output?
    uniform_sampling: False # if true, will sample points uniformly across the depth map, otherwise will sample more points in areas with higher confidence
    points_spacing: 0.01 # the smaller the number, the heavier (and hopefully more accurate) the point cloud will be

    # # only play with these if you know what you're doing
    subdivide_task: True
    workitem_size_cameras: 20
    max_workgroup_size: 100

